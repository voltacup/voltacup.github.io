<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volta Corporate Football Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a scoreboard header over one tabbed working surface; dense tables with tabular numerals. */
:root {
  --bg: #f3f6f2; --surface: #ffffff; --raised: #f8faf7; --ink: #13201b; --muted: #5b6a62; --line: #dde4de;
  --accent: #1d4fb8; --accent-ink: #ffffff; --accent-soft: #e3eafb;
  --card-y: #f0b90b; --card-r: #d5372b; --gold: #a97a12; --gold-soft: #fbf1d6; --bad-soft: #fbe5e2;
  --display: "Barlow Condensed", "IBM Plex Sans Arabic", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d1411; --surface: #141d19; --raised: #19241f; --ink: #e7eee9; --muted: #93a39a; --line: #27342d;
    --accent: #86a8ff; --accent-ink: #081230; --accent-soft: #19264d;
    --card-y: #f2c230; --card-r: #ef5a4c; --gold: #e0b452; --gold-soft: #33290f; --bad-soft: #3a1b18;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1411; --surface: #141d19; --raised: #19241f; --ink: #e7eee9; --muted: #93a39a; --line: #27342d;
  --accent: #86a8ff; --accent-ink: #081230; --accent-soft: #19264d;
  --card-y: #f2c230; --card-r: #ef5a4c; --gold: #e0b452; --gold-soft: #33290f; --bad-soft: #3a1b18;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 24px; } h3 { font-size: 19px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
a { color: var(--accent); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top .bar { display: flex; align-items: center; gap: 14px; padding: 12px 0 8px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.brand small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.brand h1 { font-size: 26px; line-height: 1.05; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--raised); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.arch { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); font-family: var(--display); font-size: 18px; font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
main { padding: 20px 0 60px; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--card-r); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=number], input[type=search], input[type=date], input[type=time], input[type=tel], input[type=email], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
textarea { width: 100%; min-height: 90px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { align-items: flex-end; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--muted); min-width: 36px; text-align: center; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card > h3 { margin-bottom: 10px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.tile b { display: block; font-family: var(--display); font-size: 34px; line-height: 1; font-weight: 700; }
.tile span { font-size: 12px; color: var(--muted); }
.tile i { font-style: normal; font-size: 12px; color: var(--muted); display: block; margin-top: 2px; }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 22px 0 10px; }
.note { padding: 10px 14px; border-radius: var(--r); background: var(--gold-soft); color: var(--ink); font-size: 14px; border: 1px solid transparent; }
.note.bad { background: var(--bad-soft); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.pts { font-weight: 700; font-family: var(--display); font-size: 18px; }
tr.q td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tr.b td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--raised); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; background: var(--raised); color: var(--muted); white-space: nowrap; }
.tag.q { background: var(--accent-soft); color: var(--accent); } .tag.b { background: var(--gold-soft); color: var(--gold); }
.tag.sus { background: var(--bad-soft); color: var(--card-r); } .tag.risk { background: var(--gold-soft); color: var(--gold); }
.cardi { display: inline-block; width: 9px; height: 13px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
.cardi.y { background: var(--card-y); } .cardi.r { background: var(--card-r); }
.ar { font-family: "IBM Plex Sans Arabic", var(--body); }

/* fixtures */
.fx { display: grid; grid-template-columns: 1fr auto 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.fx:last-child { border-bottom: 0; }
.fx.click { cursor: pointer; } .fx.click:hover { background: var(--raised); }
.fx .h { text-align: right; } .fx .w { font-weight: 600; }
.fx .sc { font-family: var(--display); font-size: 21px; font-weight: 700; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; background: var(--raised); border-radius: 6px; padding: 0 8px; }
.fx .sc.tbd { color: var(--muted); font-weight: 500; font-size: 15px; padding: 3px 8px; }
.fx .x { display: flex; gap: 4px; align-items: center; justify-content: flex-end; min-width: 0; }
.fx .pen { font-size: 12px; color: var(--muted); font-family: var(--body); font-weight: 500; }
.rd { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 10px 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.prog { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.prog button { text-align: left; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; }
.prog button:hover { border-color: var(--accent); }
.prog b { font-family: var(--display); font-size: 20px; }
.prog .barx { height: 5px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
.prog .barx i { display: block; height: 100%; background: var(--accent); }
.pod { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.pod div { border-radius: var(--r); padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); }
.pod div:first-child { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pod small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .8; font-weight: 600; }
.pod b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; }

/* modal */
.ov { position: fixed; inset: 0; background: rgba(8, 14, 11, .55); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 3vh 12px; overflow-y: auto; }
.md { background: var(--surface); border-radius: 14px; width: 100%; max-width: 980px; border: 1px solid var(--line); display: flex; flex-direction: column; }
.md.narrow { max-width: 560px; }
.md > header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.md > .body { padding: 16px 18px; }
.md > footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); border-radius: 0 0 14px 14px; }
.board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; text-align: center; margin-bottom: 14px; }
.board .tn { font-family: var(--display); font-size: 22px; font-weight: 600; line-height: 1.1; }
.board .big { font-family: var(--display); font-size: 54px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.side h4 { margin: 0 0 6px; font-family: var(--display); font-size: 18px; }
.pr { display: grid; grid-template-columns: 30px 1fr auto auto auto; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.pr .sh { color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; font-size: 13px; }
.pr.out { opacity: .55; }
.stp { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.stp button { border: 0; background: var(--raised); width: 26px; height: 28px; cursor: pointer; font-weight: 700; }
.stp span { min-width: 24px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.stp.has span { color: var(--accent); }
.cb { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-weight: 700; font-size: 12px; padding: 0; }
.cb.y.on { background: var(--card-y); color: #201700; border-color: var(--card-y); }
.cb.r.on { background: var(--card-r); color: #fff; border-color: var(--card-r); }
.hd { display: grid; grid-template-columns: 30px 1fr 78px 28px 28px; gap: 6px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-bottom: 4px; border-bottom: 1px solid var(--line); text-align: center; }
.hd span:nth-child(2) { text-align: left; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 9px; z-index: 80; font-size: 14px; max-width: 92vw; }
.toast.bad { background: var(--card-r); color: #fff; }
.sheetprev { background: #fff; color: #000; border: 1px solid var(--line); border-radius: 8px; overflow: auto; padding: 10px; }
.sheetprev .ss { width: 1040px; }

/* admin area */
.adm { display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 20px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 124px; }
.side button { text-align: left; padding: 9px 12px; border: 0; border-radius: 8px; background: none; cursor: pointer; font-family: var(--display); font-size: 18px; font-weight: 600; color: var(--muted); border-left: 3px solid transparent; }
.side button:hover { background: var(--surface); color: var(--ink); }
.side button.on { background: var(--surface); color: var(--accent); border-left-color: var(--accent); }
.tb { margin: 0; padding: 0; list-style: none; counter-reset: tb; display: flex; flex-direction: column; gap: 4px; max-width: 460px; }
.tb li { counter-increment: tb; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); }
.tb li::before { content: counter(tb); font-family: var(--display); font-weight: 700; color: var(--accent); width: 18px; }
.tb li span { flex: 1; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flow span { padding: 6px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-family: var(--display); font-size: 17px; font-weight: 600; }
.flow i { font-style: normal; color: var(--muted); }
.phase { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.phase > div { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; display: flex; flex-direction: column; gap: 2px; }
.phase b { font-family: var(--display); font-size: 17px; } .phase span { font-size: 12px; }
.barx { height: 5px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; } .barx i { display: block; height: 100%; background: var(--accent); }
table.grid-s { table-layout: fixed; min-width: 520px; }
table.grid-s td { vertical-align: top; border: 1px solid var(--line); padding: 4px; height: 54px; }
table.grid-s th { text-align: center; } table.grid-s th:first-child, table.grid-s td.tm { width: 62px; text-align: right; font-weight: 600; color: var(--muted); border-left: 0; }
.mc { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 4px 7px; background: var(--raised); cursor: grab; display: flex; flex-direction: column; font-size: 13px; line-height: 1.25; min-width: 0; }
.mc small { font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.mc.bad { border-color: var(--card-r); border-left-color: var(--card-r); background: var(--bad-soft); } .mc.done { border-left-color: var(--muted); opacity: .8; }
.mc + .mc { margin-top: 4px; }
.evt { font-size: 12px; padding: 3px 7px; border-radius: 6px; background: var(--gold-soft); color: var(--gold); font-weight: 600; margin-bottom: 4px; }
.unp { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; } .unp .mc + .mc { margin-top: 0; }
.qr svg { display: block; background: #fff; border-radius: 8px; } .qr.big svg { width: min(38vh, 380px); height: auto; }
code { font-size: 13px; background: var(--raised); padding: 1px 5px; border-radius: 4px; }
/* slideshow: one dark stage in both themes */
.show { position: fixed; inset: 0; z-index: 40; background: #0b1410; color: #eef4ef; display: flex; flex-direction: column; padding: 3vh 4vw; overflow: auto; }
.show > header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 2.5vh; }
.show small { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #86a8ff; font-weight: 600; }
.show h2 { font-size: clamp(30px, 5vh, 56px); line-height: 1; color: #fff; }
.show .btn { background: #17231d; border-color: #2b3a32; color: #cfdad3; } .show .sl-dim { color: #93a39a; font-size: .8em; }
.sl-body { flex: 1; display: flex; flex-direction: column; justify-content: center; font-size: clamp(16px, 2.6vh, 30px); }
.sl-list { display: flex; flex-direction: column; }
.sl-row { display: flex; align-items: center; gap: 1.2em; padding: .42em .2em; border-bottom: 1px solid #22302a; }
.sl-n { font-family: var(--display); font-weight: 700; color: #86a8ff; width: 1.6em; text-align: right; }
.sl-sc { font-family: var(--display); font-size: 1.35em; font-weight: 700; min-width: 3.4em; text-align: center; background: #17231d; border-radius: 8px; color: #fff; }
.sl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 2.4vh 3vw; font-size: clamp(13px, 1.9vh, 22px); }
.sl-grid h4 { margin: 0 0 .2em; font-family: var(--display); font-size: 1.35em; color: #86a8ff; }
.sl-grid table { font-size: inherit; } .sl-grid th { color: #93a39a; border-color: #22302a; } .sl-grid td { border-color: #22302a; padding: .22em .5em; }
.sl-grid tr.q td:first-child { box-shadow: inset 3px 0 0 #86a8ff; }
.sl-sp { display: flex; align-items: center; justify-content: center; gap: 6vw; flex-wrap: wrap; }
.sl-names { display: flex; flex-direction: column; gap: .5em; font-family: var(--display); font-size: 1.5em; font-weight: 600; }

.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 99px; background: var(--card-r); color: #fff; font: 600 12px/20px var(--body); text-align: center; vertical-align: 2px; }
table.rg td { padding: 4px 6px; } table.rg th:nth-child(2) { width: 46%; } table.rg th:nth-child(3) { width: 90px; } table.rg { min-width: 0; }
img.tlogo { width: 20px; height: 20px; object-fit: contain; border-radius: 4px; vertical-align: -5px; margin-right: 6px; background: #fff; } img.tlogo.r { margin: 0 0 0 6px; } img.tlogo.big { width: 34px; height: 34px; vertical-align: -8px; margin-right: 8px; }
/* home */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 22px 24px; }
.hero small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; opacity: .85; }
.hero h2 { font-size: clamp(28px, 4.2vw, 44px); line-height: 1.05; margin-top: 4px; }
.hero p { margin: 10px 0 0; max-width: 70ch; white-space: pre-line; }
.hero .pill { background: rgba(255, 255, 255, .16); border-color: transparent; color: inherit; }
.hero .btn { background: transparent; color: inherit; border-color: rgba(255, 255, 255, .45); text-decoration: none; }
.homegrid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; margin-top: 22px; align-items: start; }
.news > header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.news.pin { border-color: var(--gold); }
.news img { display: block; max-width: 100%; max-height: 420px; border-radius: 8px; margin: 4px 0 10px; }
.news p { margin: 0; white-space: pre-line; max-width: 70ch; }
.filechip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); font-size: 14px; max-width: 100%; flex-wrap: wrap; }
.filechip .muted { font-size: 12px; }
.filelist { display: flex; flex-direction: column; gap: 6px; }
.upl { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
.upl img { display: block; max-width: 100%; max-height: 160px; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--line); }
input[type=file] { max-width: 100%; font-size: 13px; }
.spgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.spgrid.main { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.sp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.sp a, .sp > div { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: inherit; min-height: 64px; justify-content: center; }
.sp img { max-width: 100%; max-height: 70px; object-fit: contain; background: #fff; border-radius: 6px; padding: 6px; }
.spgrid.main .sp img { max-height: 110px; }
.sp b { font-family: var(--display); font-size: 20px; } .sp span { font-size: 12px; color: var(--muted); }
img.thumb { height: 30px; max-width: 90px; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; display: block; }
.sl-logos { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 3vh 3vw; flex: 1 1 420px; align-items: center; }
